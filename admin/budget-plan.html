<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARSATU NEXT - พิจารณาแฟ้มงบประมาณ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Anuphan', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-gray-800 pb-24 lg:pb-10">

    <div class="lg:hidden bg-white border-b border-gray-200 sticky top-0 z-40 px-5 py-4 flex justify-between items-center shadow-sm">
        <h1 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="shield-check" class="w-5 h-5 text-indigo-600"></i> พิจารณาแฟ้มงบฯ</h1>
        <button onclick="window.location.href='dashboard.html'" class="p-2 bg-gray-50 text-gray-600 rounded-xl"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

    <div class="max-w-5xl mx-auto lg:mt-10 px-4 lg:px-0">
        <div class="hidden lg:flex justify-between items-end mb-6">
            <div>
                <button onclick="window.location.href='dashboard.html'" class="text-gray-500 hover:text-gray-800 flex items-center gap-1 mb-2 text-sm font-bold transition-colors"><i data-lucide="arrow-left" class="w-4 h-4"></i> กลับหน้าแดชบอร์ด</button>
                <h1 class="text-2xl font-extrabold text-gray-900 flex items-center gap-2"><i data-lucide="shield-check" class="w-6 h-6 text-indigo-600"></i> ระบบพิจารณาแฟ้มงบประมาณ (ส่วนกลาง)</h1>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6 mt-4 lg:mt-0">
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-xs text-gray-500 font-bold mb-1">ยอดขออนุมัติรวม</p>
                <p class="text-xl font-extrabold text-gray-800" id="sum-all">0 ฿</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-xs text-emerald-600 font-bold mb-1">อนุมัติแล้ว (Approved)</p>
                <p class="text-xl font-extrabold text-emerald-600" id="sum-approved">0 ฿</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-xs text-red-600 font-bold mb-1">ยอดที่ตัดทิ้ง (Denied)</p>
                <p class="text-xl font-extrabold text-red-600" id="sum-denied">0 ฿</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-xs text-indigo-600 font-bold mb-1">รอตรวจ (Pending)</p>
                <p class="text-xl font-extrabold text-indigo-600" id="sum-pending">0 ฿</p>
            </div>
        </div>

        <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm mb-6 flex flex-col md:flex-row gap-3">
            <div class="flex-1">
                <label class="block text-[10px] font-bold text-gray-500 mb-1">ฝ่าย (Department)</label>
                <select id="filter-dept" onchange="applyAdminFilters()" class="w-full bg-gray-50 rounded-xl p-2.5 text-sm outline-none ring-1 ring-gray-200 focus:ring-indigo-500 transition-all">
                    <option value="all">ทุกฝ่าย</option>
                </select>
            </div>
            <div class="flex-1">
                <label class="block text-[10px] font-bold text-gray-500 mb-1">สถานะแฟ้ม</label>
                <select id="filter-status" onchange="applyAdminFilters()" class="w-full bg-gray-50 rounded-xl p-2.5 text-sm outline-none ring-1 ring-gray-200 focus:ring-indigo-500 transition-all">
                    <option value="all">ทั้งหมด (ไม่รวมร่าง)</option>
                    <option value="pending">รอส่วนกลางตรวจ</option>
                    <option value="reviewed">ตรวจแล้ว</option>
                </select>
            </div>
        </div>

        <div id="admin-request-list" class="space-y-4"></div>
    </div>

    <!-- Modal แอดมินบังคับแก้ (Force Edit) พร้อมแถบจำลองงบประมาณ (What-If Bar) -->
    <div id="admin-edit-modal" class="hidden fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg p-5 shadow-2xl relative">
            <h2 class="text-lg font-bold text-indigo-800 mb-4 border-b pb-2 flex items-center gap-2"><i data-lucide="calculator" class="w-5 h-5"></i> พิจารณารายการ (Admin)</h2>
            <form id="admin-edit-form" class="space-y-4">
                <input type="hidden" id="admin-item-id">
                
                <div class="flex gap-3">
                    <div class="flex-1"><label class="block text-xs font-bold text-gray-700 mb-1">จำนวน</label><input type="number" id="admin-qty" required min="1" oninput="adminCalcTotal()" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm bg-white outline-none"></div>
                    <div class="flex-1"><label class="block text-xs font-bold text-gray-700 mb-1">ราคา/หน่วย</label><input type="number" id="admin-price" required min="0" step="0.01" oninput="adminCalcTotal()" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm bg-white outline-none"></div>
                    <div class="flex-1"><label class="block text-xs font-bold text-red-600 mb-1">ส่วนลด (฿)</label><input type="number" id="admin-discount" min="0" step="0.01" value="0" oninput="adminCalcTotal()" class="w-full border border-red-200 rounded-xl p-2.5 text-sm bg-red-50 outline-none text-red-700"></div>
                </div>

                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 flex justify-between items-center">
                    <span class="text-xs font-bold text-gray-600">ราคารวมรายการนี้:</span>
                    <span id="admin-total-display" class="text-lg font-extrabold text-indigo-600">0.00 ฿</span>
                    <input type="hidden" id="admin-total-price" value="0">
                </div>

                <!-- 📊 แถบจำลองงบประมาณ (What-If Progress Bar) -->
                <div class="bg-indigo-50/50 p-3 rounded-xl border border-indigo-100 mt-2">
                    <div class="flex justify-between items-end mb-1.5">
                        <label class="block text-[10px] font-bold text-indigo-900 uppercase tracking-wide">จำลองผลกระทบต่องบ <span id="modal-dept-name" class="bg-indigo-200 text-indigo-800 px-1.5 rounded"></span></label>
                        <span class="text-[10px] font-bold text-gray-700 bg-white px-1.5 rounded border border-gray-200" id="modal-budget-status">0 / 0 ฿</span>
                    </div>
                    <!-- หลอดพลัง -->
                    <div class="w-full bg-gray-200 rounded-full h-2.5 flex overflow-hidden shadow-inner relative">
                        <div id="pb-used" class="bg-gray-400 h-2.5 transition-all duration-300" style="width: 0%"></div>
                        <div id="pb-current" class="bg-indigo-500 h-2.5 transition-all duration-300 relative" style="width: 0%">
                            <!-- ขีดกระพริบเพื่อดึงสายตา -->
                            <div class="absolute right-0 top-0 bottom-0 w-1 bg-white/50 animate-pulse"></div>
                        </div>
                    </div>
                    <div class="flex justify-between mt-1.5">
                        <span class="text-[9px] font-bold text-gray-500" id="pb-text-used">ใช้ไปแล้ว: 0 ฿</span>
                        <span class="text-[9px] font-extrabold text-indigo-600" id="pb-text-current">+ เพิ่มชิ้นนี้: 0 ฿</span>
                        <span class="text-[9px] font-bold text-emerald-600" id="pb-text-remain">เหลือโควตา: 0 ฿</span>
                    </div>
                </div>

                <div><label class="block text-xs font-bold text-gray-700 mb-1 mt-2">หมายเหตุแอดมิน (บอกเหตุผลที่ตัดงบ)</label><textarea id="admin-remark" rows="2" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm bg-white outline-none"></textarea></div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeAdminEdit()" class="flex-1 bg-white border border-gray-200 text-gray-600 py-2.5 rounded-xl font-bold text-sm hover:bg-gray-50 transition">ยกเลิก</button>
                    <button type="submit" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-sm shadow-md hover:bg-indigo-700 transition">อนุมัติตามยอดนี้</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script src="../js/admin-budget-plan.js"></script>
</body>
</html>
